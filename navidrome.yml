services:
  navidrome:
    image: navidrome/navidrome:latest
    user: 1000:1000 # must own the data folder and be able to read music folder(s). See Permissions below
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      # Optional: put your config options customization here. Examples:
      
      ND_BASEURL: "https://music.sbnet.org"
      ND_DEFAULTTHEME: "Dark"
      ND_LOGLEVEL: info
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      ND_ENABLESHARING: "true"
      ND_PREFERSORTTAGS: "true"
      ND_SCANSCHEDULE: 1h
    volumes:
      - "./data:/data"
      - "/mnt/plex/Media/music/music:/music:ro"
